name: Documentation CI and Deploy

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: docs-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build documentation
        run: sphinx-build -n -W --keep-going -b html source build/html

      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL" || (echo "RENDER_DEPLOY_HOOK_URL is not configured." >&2; exit 1)
          curl --fail-with-body --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"
